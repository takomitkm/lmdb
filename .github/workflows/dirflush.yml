name: dirflush
on:
  push:
    branches: [dirflush]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dirflush

      - name: build (mingw gcc)
        run: |
          set -e
          cd libraries/liblmdb
          gcc --version | head -1
          gcc -O2 -I. -o dirsync.exe dirsync-test.c mdb.c midl.c
          gcc -O2 -I. -DMDB_DIRSYNC_PROBE -o dirsync-probe.exe dirsync-test.c mdb.c midl.c
          gcc -O2 -I. -o race.exe race-test.c mdb.c midl.c
          gcc -O2 -I. -o bench-dirroot.exe e25_lmdb_bench.c mdb.c midl.c
          gcc -O2 -I. -o dirname-dirroot.exe dirname-test.c midl.c
          cp mdb-base.c mdb.c
          gcc -O2 -I. -o dirname-base.exe dirname-test.c midl.c 2>/dev/null \
            || echo "pristine mdb.c has no mdb_dirname (expected; unit test is patched-only)"
          gcc -O2 -I. -o bench-base.exe e25_lmdb_bench.c mdb.c midl.c
          cp mdb-dir.c mdb.c
          gcc -O2 -I. -o dirname-dir.exe dirname-test.c midl.c
          gcc -O2 -I. -o bench-dir.exe e25_lmdb_bench.c mdb.c midl.c
          cp mdb-dirroot.c mdb.c

      - name: unit tests (dirname, patched variants must pass)
        run: |
          set -e
          cd libraries/liblmdb
          ./dirname-dir.exe
          ./dirname-dirroot.exe

      - name: functional tests (env + copy in all modes)
        run: |
          set -e
          cd libraries/liblmdb
          mkdir -p /d/dirt/a /d/dirt/b /d/dirt/e /d/dirt/f /d/dirt/nosub
          ./dirsync.exe /d/dirt/a /d/dirt/b normal
          ./dirsync.exe /d/dirt/c /d/dirt/d nosubdir
          ./dirsync.exe /d/dirt/e /d/dirt/f nosync
          ./dirsync.exe /d/dirt/nosub/g /d/dirt/nosub/h nosubdir-nosync

      - name: green side - probe shows dir flush AND root flush (root_err=0)
        run: |
          set -e
          cd libraries/liblmdb
          mkdir -p /d/dirt/probe/a /d/dirt/probe/b
          ./dirsync-probe.exe /d/dirt/probe/a /d/dirt/probe/b normal 2> probe.out || true
          cat probe.out
          nd=$(grep -c 'DIRSYNC-PROBE dir=.*open_err=0 flush_err=0' probe.out || true)
          nr=$(grep -c 'DIRSYNC-PROBE-ROOT dir=.*root_err=0' probe.out || true)
          echo "dir-flush lines: $nd, root-flush lines: $nr"
          [ "$nd" -ge 1 ] && [ "$nr" -ge 1 ]

      - name: red side - pristine build prints no probe lines at all
        run: |
          set -e
          cd libraries/liblmdb
          gcc -O2 -I. -DMDB_DIRSYNC_PROBE -o dirsync-base.exe dirsync-test.c mdb-base.c midl.c
          mkdir -p /d/dirt/red/a /d/dirt/red/b
          ./dirsync-base.exe /d/dirt/red/a /d/dirt/red/b normal 2> red.out || true
          cat red.out
          n=$(grep -c 'DIRSYNC-PROBE' red.out || true)
          echo "probe lines on pristine: $n"
          [ "$n" -eq 0 ]

      - name: race test (informational, counts the documented limitation)
        run: |
          cd libraries/liblmdb
          mkdir -p /d/dirt/ra /d/dirt/rb
          ./race.exe /d/dirt/ra /d/dirt/rb 2000 || true

      - name: bench - env creation + commit cost, three variants (3 rounds)
        run: |
          cd libraries/liblmdb
          for r in 1 2 3; do
            ./bench-base.exe /d/dirt/bench 100 2000 base
            ./bench-dir.exe /d/dirt/bench 100 2000 dir
            ./bench-dirroot.exe /d/dirt/bench 100 2000 dirroot
          done

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dirflush

      - name: build
        run: |
          set -e
          cd libraries/liblmdb
          gcc --version | head -1
          gcc -O2 -I. -o dirsync-linux dirsync-test.c mdb.c midl.c
          gcc -O2 -I. -o dirname-dirroot-linux dirname-test.c midl.c
          gcc -O2 -I. -o bench-dirroot-linux e25_lmdb_bench.c mdb.c midl.c
          cp mdb-base.c mdb.c
          gcc -O2 -I. -o dirname-base-linux dirname-test.c midl.c 2>/dev/null \
            || echo "pristine mdb.c has no mdb_dirname (expected)"
          gcc -O2 -I. -o bench-base-linux e25_lmdb_bench.c mdb.c midl.c
          cp mdb-dir.c mdb.c
          gcc -O2 -I. -o dirname-dir-linux dirname-test.c midl.c
          gcc -O2 -I. -o bench-dir-linux e25_lmdb_bench.c mdb.c midl.c
          cp mdb-dirroot.c mdb.c

      - name: unit tests (patched variants)
        run: |
          set -e
          cd libraries/liblmdb
          ./dirname-dir-linux && ./dirname-dirroot-linux

      - name: green side - strace shows fsync on a directory fd
        run: |
          set -e
          cd libraries/liblmdb
          sudo apt-get update -qq
          sudo apt-get install -y strace
          mkdir -p /tmp/dirt/g/a /tmp/dirt/g/b
          strace -f -e trace=fsync,fdatasync,openat ./dirsync-linux /tmp/dirt/g/a /tmp/dirt/g/b >/dev/null 2> strace.out || true
          echo "--- directory fsyncs (openat with O_DIRECTORY, then fsync):"
          grep -E 'fsync\(' strace.out | head -5
          n=$(grep -c 'fsync(' strace.out || true)
          echo "fsync calls: $n"
          [ "$n" -ge 1 ]

      - name: bench (same three variants)
        run: |
          cd libraries/liblmdb
          mkdir -p /tmp/dirt/bench
          for r in 1 2 3; do
            ./bench-base-linux /tmp/dirt/bench 100 2000 base
            ./bench-dir-linux /tmp/dirt/bench 100 2000 dir
            ./bench-dirroot-linux /tmp/dirt/bench 100 2000 dirroot
          done
